name: Build Dynamic Island

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore DynamicIsland\DynamicIsland.csproj

    - name: Publish Single-File Executable
      run: >
        dotnet publish DynamicIsland\DynamicIsland.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -o publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DynamicIsland-Windows10
        path: publish/DynamicIsland.exe

    - name: Create or Update Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0
        name: Dynamic Island v2.0.0 (Release)
        body: |
          🚀 **Автоматическая сборка Dynamic Island для Windows 10**
          
          Скачайте `DynamicIsland.exe` ниже и запустите!
          - Установка не требуется (портативный автономный файл).
          - Оптимизировано под Windows 10: 60–120 FPS, ~30 МБ RAM, 0% CPU в простое.
        files: publish/DynamicIsland.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
