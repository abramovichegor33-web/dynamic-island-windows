name: Build Dynamic Island

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Build EXE
      run: dotnet publish DynamicIsland\DynamicIsland.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0
        files: publish/DynamicIsland.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
